# Builds and tests every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test --project tests/ImageDigestAdvisor.Core.Tests

      - name: Build app (MSIX and unpackaged)
        shell: pwsh
        run: |
          dotnet build ImageDigestAdvisor.slnx -c Release
          if ($LASTEXITCODE -ne 0) { throw "Packaged build failed" }
          dotnet build src/ImageDigestAdvisor.App -c Release -p:Platform=x64 -p:Unpackaged=true
          if ($LASTEXITCODE -ne 0) { throw "Unpackaged build failed" }
